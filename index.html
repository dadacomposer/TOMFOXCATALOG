<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Base SEO -->
    <title>Tom Fox | 2600+ tracks, selected for creators</title>
    <meta name="description" content="The soundtrack of modern storytelling - 2600+ curated tracks. Discover and license premium music for video creators, filmmakers, and studios." />
    <meta name="robots" content="%SEO_ROBOTS%" />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:title" content="Tom Fox | 2600+ tracks, selected for creators" />
    <meta property="og:description" content="The soundtrack of modern storytelling - 2600+ curated tracks." />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_ORIGIN%/" />
    <meta name="twitter:title" content="Tom Fox | 2600+ tracks, selected for creators" />
    <meta name="twitter:description" content="The soundtrack of modern storytelling - 2600+ curated tracks." />
    
    <!-- PWA & Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- AI & SEO Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tom Fox Catalog",
      "url": "%SITE_ORIGIN%/",
      "description": "The soundtrack of modern storytelling - 2600+ curated premium music tracks.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "%SITE_ORIGIN%/browse?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tom Fox Catalog",
      "url": "%SITE_ORIGIN%/",
      "logo": "%SITE_ORIGIN%/favicon.png",
      "description": "Exclusive high-end music catalog providing the soundtrack of modern storytelling for video creators, filmmakers, and studios."
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
