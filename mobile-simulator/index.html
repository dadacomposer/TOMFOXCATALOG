<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Simulator - Tom Fox Catalog</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            margin: 0;
            color: #888;
            font-size: 14px;
        }

        .device {
            position: relative;
            width: 390px;
            height: 844px; /* iPhone 12/13/14 Pro dimensions */
            background-color: #000;
            border-radius: 40px;
            box-shadow: 0 0 0 12px #333, 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            flex-shrink: 0;
        }

        /* The Notch */
        .device::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #333;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 10;
        }

        .device iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mobile Simulator</h1>
        <p>Testing against localhost:5173 (iPhone 14 Pro Size)</p>
    </div>

    <div class="device">
        <iframe id="app-frame" src="http://localhost:5173" title="Mobile App View"></iframe>
    </div>

    <div class="controls">
        <button onclick="document.getElementById('app-frame').contentWindow.location.reload()">Refresh App</button>
        <button onclick="window.open('http://localhost:5173', '_blank')">Open Fullscreen</button>
    </div>
</body>
</html>
